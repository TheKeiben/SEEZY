amcl:
  ros__parameters:
    # ==========================================
    # 1. General Settings
    # ==========================================
    use_sim_time: False
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    tf_broadcast: True
    transform_tolerance: 1.0
    save_pose_rate: 0.5

    # ==========================================
    # 2. Particle Filter Parameters
    # ==========================================  
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    # Distances/Angles to move before triggering an update
    update_min_a: 0.2 # Update after rotating 0.2 radians
    update_min_d: 0.25 # Update after moving 0.25 meters
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    
    # ==========================================
    # 3. Motion / Odometry Model (Differential)
    # ==========================================
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    # Expected noise in odometry (rotation from rotation, translation from translation, etc.)
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    
    # ==========================================
    # 4. Laser Model
    # ==========================================
    scan_topic: scan
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1
    # Beam skipping parameters (Useful for dynamic environments)
    do_beamskip: False
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
